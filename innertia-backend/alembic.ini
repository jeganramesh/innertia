# A generic, single-file configuration file.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
# The output format for this can be found in:
# https://alembic.sqlalchemy.org/en/latest/tutorial.html#file-name-template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# The URL should be the connection URL for the database to migrate.
# For async PostgreSQL with SQLAlchemy 2.0, use:
sqlalchemy.url = postgresql+asyncpg://innertia_user:innertia_pass@postgres:5432/innertia

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

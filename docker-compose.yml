services:
  postgres:
    image: postgres:16-alpine
    container_name: innertia_postgres
    environment:
      POSTGRES_DB: innertia
      POSTGRES_USER: innertia_user
      POSTGRES_PASSWORD: innertia_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innertia_user -d innertia"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - innertia_network

  redis:
    image: redis:7-alpine
    container_name: innertia_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - innertia_network

  backend:
    build:
      context: ./innertia-backend
      dockerfile: Dockerfile
    container_name: innertia_backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - innertia-backend/.env
    volumes:
      - ./innertia-backend:/app
      - /app/__pycache__
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - innertia_network
    environment:
      - PYTHONPATH=/app

  frontend:
    build:
      context: ./innertia-frontend
      dockerfile: Dockerfile
      target: builder
    container_name: innertia_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - innertia-frontend/.env
    volumes:
      - ./innertia-frontend:/app
      - /app/node_modules
    command: npm run dev -- --host --port 3000
    networks:
      - innertia_network
    stdin_open: true
    tty: true

  celery_worker:
    build:
      context: ./innertia-backend
      dockerfile: Dockerfile
    container_name: innertia_celery
    command: celery -A app.celery_worker worker --loglevel=info
    depends_on:
      - postgres
      - redis
      - backend
    env_file:
      - innertia-backend/.env
    volumes:
      - ./innertia-backend:/app
      - /app/__pycache__
    networks:
      - innertia_network
    environment:
      - PYTHONPATH=/app

volumes:
  postgres_data:
  redis_data:

networks:
  innertia_network:
    driver: bridge
